<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Torray Student — Student Workspace</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="src/styles.css"></head><body><div class="app-shell"><aside class="sidebar"><a class="logo" href="#"><b>T</b><span>TORRAY<span>STUDENT WORKSPACE</span></span></a><p class="nav-caption">WORKSPACE</p><button class="nav-item active" data-view="dashboard">▦ <span>Dashboard</span></button><button class="nav-item" data-view="students">♙ <span>Data mahasiswa</span></button><button class="nav-item" data-view="departments">▤ <span>Program studi</span></button><div class="sidebar-bottom"><div class="profile"><div class="avatar">A</div><div><b>Personal workspace</b><small>Supabase Auth</small></div></div><button id="exportAll" class="logout">Export data ↗</button><button id="logout" class="logout">Keluar ↗</button></div></aside><main class="main"><header class="topbar"><div><small>YOUR ACADEMIC WORKSPACE</small><h1 id="pageTitle">Dashboard</h1></div><div class="top-actions"><span class="demo-badge">● PRIVATE WORKSPACE</span><button class="primary" id="topAdd">＋ Mahasiswa baru</button></div></header><section id="view"></section></main></div><dialog id="studentDialog"><form id="studentForm"><button type="button" class="close" id="closeForm">×</button><p class="overline">STUDENT RECORD</p><h2 id="formHeading">Tambah mahasiswa</h2><input type="hidden" id="recordId"><label>NIM<input id="nim" required maxlength="24" placeholder="Contoh: 20260001"></label><label>Nama lengkap<input id="fullName" required minlength="2" maxlength="100" placeholder="Nama mahasiswa"></label><label>Program studi<select id="department" required></select></label><label>Email<input id="email" type="email" maxlength="120" placeholder="nama@email.com"></label><label>Status<select id="status"><option>Aktif</option><option>Cuti</option><option>Lulus</option></select></label><div class="form-actions"><button type="button" class="secondary" id="cancelForm">Batal</button><button class="primary" type="submit">Simpan data</button></div></form></dialog><div id="toast" role="status" aria-live="polite"></div><script type="module" src="src/main.js"></script></body></html>
